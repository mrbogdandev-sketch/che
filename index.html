<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="История обновлений ЧеКак.">
  <title>ченжлоги чекак</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="https://chekak.xyz"><img src="logo.svg" width="110" alt="ЧеКак"></a>
    <nav aria-label="основная навигация">
      <a href="https://about.chekak.xyz">о проекте</a>
      <a href="https://chekak.xyz">открыть чекак</a>
    </nav>
  </header>

  <main>
    <section class="page-heading">
      <div>
        <h1>ченжлоги чекак</h1>
        <p>что нового было и что исправнлено.</p>
      </div>
      <div class="search-tools">
        <label for="search-input">поиск по ченжлогам:</label>
        <div class="search-row">
          <input id="search-input" type="search" placeholder="введи слово">
          <button id="clear-search" type="button">сбросить</button>
        </div>
        <p id="results-count" aria-live="polite"></p>
      </div>
    </section>

    <div class="page-layout">
      <aside class="archive" aria-label="дерево ченжлогов">
        <details id="archive-disclosure" open>

        <section id="entries" aria-live="polite"></section>
        <p id="empty-state" hidden>ничего не найдено.</p>
        <p id="load-error" hidden>список не загрузился.</p>
      </section>
    </div>

  <footer class="site-footer">
